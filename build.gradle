plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'


    /**
     * Lombok
     */
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.24'
    annotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.24'

    /**
     * Itext Pdf
     */
    implementation 'com.itextpdf:itext7-core:7.2.5'

    /**
     * for Logging
     */

    implementation 'org.slf4j:slf4j-api:2.0.0-alpha1'
    implementation 'org.slf4j:slf4j-simple:2.0.0-alpha1'  // For simple logging

    /**
     * for take the screenshot using selenium
     */
    implementation 'org.seleniumhq.selenium:selenium-java:4.12.0'
    implementation 'org.seleniumhq.selenium:htmlunit-driver:2.60.0'
    implementation 'org.seleniumhq.selenium:selenium-chrome-driver:4.12.0'

    // Apache Commons IO for file operations (optional)
    implementation 'commons-io:commons-io:2.11.0'

    /**
     * for yaml configurations
     */ 
    implementation group: 'org.yaml', name: 'snakeyaml', version: '2.3'


}

test {
    useJUnitPlatform()
}